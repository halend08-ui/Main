# Claude Code GitHub Action (anthropics/claude-code-action@v1).
# Requires: Claude GitHub App installed on this repo + repository secret ANTHROPIC_API_KEY (see commerce-os/APPROVAL_QUEUE.md APR-003).
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Check secret is configured
        id: secret
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: if [ -n "$KEY" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ANTHROPIC_API_KEY not set — skipping (APR-003)."; fi
      - if: steps.secret.outputs.ok == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - if: steps.secret.outputs.ok == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --max-turns 30
            --disallowedTools "Bash(shopify theme publish:*),Bash(shopify theme delete:*),Bash(git push --force:*)"
