[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-engine"
version = "0.1.0"
description = "Autonomous stock & cryptocurrency investment research engine (decision support only)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.24",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
providers = ["requests>=2.31"]
api = ["fastapi>=0.110", "uvicorn>=0.27"]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]
# Real historical bars for the offline dataset builder. Not needed to run
# or test the engine; only scripts/build_real_dataset.py reads it.
real-data = ["bokeh_sampledata>=2024.2"]

[project.scripts]
research-engine = "research_engine.cli:main"

[tool.setuptools.packages.find]
include = ["research_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::RuntimeWarning"]
addopts = "-q"

[tool.coverage.run]
source = ["research_engine"]
